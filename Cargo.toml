# modules-lab — experiments written against the modules SDK, out of tree.
#
# A crate here keeps the shape of programs' `crates/app/*` (a view is a cdylib
# for wasm32-unknown-unknown on `view`), so one that earns its place moves
# over as it is.

[workspace]
resolver = "2"
members = ["crates/app/trade", "crates/app/trade-view", "crates/app/arcade", "crates/app/arcade-view", "crates/app/huddle", "crates/app/browser-view", "crates/app/huddle-view", "crates/bots/tetris-bot", "crates/bots/trade-bot", "crates/tools/pack", "crates/tools/trade-stage"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- sdk-line: programs dev a358ea23, WIRE 967e0ea397677413 (a program's access and resource,
# programs#456/#457, and the fast profile, #454; on core dev 89f3cf555 and gpui-pre c698ed2c).
# The views here are built at the rev the app pins, so this moves when the app's pin moves, and
# the [patch] tables at the end with it: they name core, gpui-pre and fluent31 at programs' revs.
view = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
# What a program is written against: the kernel ABI (a copy of core's, never
# to drift from it), the program SDK and its mock host, the tables, and the
# describe module.
abi = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
program = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
store = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
describe = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
# The op that gives a key its account: what a live stage's seed sends first
# (`crates/tools/trade-stage`), the market maker's account by its
# key (`crates/bots/trade-bot`), and the profiles arcade-view reads names from.
identity = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
# What packs a program with its view and its describe module, as a founding
# takes it (`crates/tools/pack`, which `live/live.sh` runs).
founding = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
# The chain id a live track's namespace starts with (`ChainId::of`), as the
# app names it: what tetris-bot names the versus room by.
ducklink = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655" }
# `canvas().rect` takes a `Bounds` made with gpui's `point` and `size`, which
# the SDK does not re-export.
# The rev is the one modules names.
gpui = { package = "gpui-pre", git = "duck://garage-b703fab0/forge/gpui-pre", rev = "c698ed2c7e8eeed46641e5ea9622ee55b84b1486", default-features = false }

# ---- here
trade = { path = "crates/app/trade" }
arcade = { path = "crates/app/arcade" }
huddle = { path = "crates/app/huddle" }

# ---- external
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the address field reads a page's host as its engine does (the URL
# standard); gpui links it already
url = "2"

# proc-macro and build-script crates are compiled once and then run for every
# unit below them — unoptimized they dominate a debug build.
[profile.dev.build-override]
opt-level = 2

# The profile modules ships its views from: size for the shared code, speed
# for the view and the SDK crates only a view links (a view's redraw is fuel
# per instruction).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.trade-view]
opt-level = 3
[profile.release.package.arcade-view]
opt-level = 3
[profile.release.package.browser-view]
opt-level = 3
[profile.release.package.huddle-view]
opt-level = 3
[profile.release.package.view]
opt-level = 3
[profile.release.package.view-wire]
opt-level = 3
[profile.release.package.gpui-pre]
opt-level = 3

# `WASM_PROFILE=fast` (dev and garage): the release profile without what
# makes a release slow to build, one fat-LTO link of one codegen unit per
# artifact; the view gate skips wasm-opt for it too. The opt-levels above
# stay, so a view's fuel stays close to what ships. Its own output dir; main
# and duckpond take the release profile's bytes.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

# The patches modules' root carries: the fork's MessagePack and scheduler
# crates. A dependency's `[patch]` does not reach its dependents, so they are
# repeated here, at the same rev.
[patch.crates-io]
rmp-serde = { git = "duck://garage-b703fab0/forge/gpui-pre", rev = "c698ed2c7e8eeed46641e5ea9622ee55b84b1486" }
gpui-pre-scheduler = { git = "duck://garage-b703fab0/forge/gpui-pre", rev = "c698ed2c7e8eeed46641e5ea9622ee55b84b1486" }

# The SDK's fake node (`view`'s `rig`) links programs' blobs crate, which links
# core's `blob` and with it core's abi: one abi in the graph, the programs
# copy, as the app patches it.
[patch."duck://garage-b703fab0/forge/ducktape"]
abi = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655", package = "abi" }

# programs and core, at the revs above, still name their dependencies by GitHub link: the same
# crates from forge, so the graph holds one copy of each and nothing is fetched from GitHub.
[patch."https://github.com/ducktape-industries/ducktape"]
abi = { git = "duck://garage-b703fab0/forge/programs", rev = "a358ea23027f529298126f4543b23ee2b87af655", package = "abi" }
blob = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
consensus = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
halo = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
host = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
keyscheme = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
live-wire = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
node = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
noded = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
runtime = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
state = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
statesync = { git = "duck://garage-b703fab0/forge/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }

[patch."https://github.com/ducktape-industries/gpui-pre"]
gpui-pre = { git = "duck://garage-b703fab0/forge/gpui-pre", rev = "c698ed2c7e8eeed46641e5ea9622ee55b84b1486" }
gpui-pre-scheduler = { git = "duck://garage-b703fab0/forge/gpui-pre", rev = "c698ed2c7e8eeed46641e5ea9622ee55b84b1486" }
rmp-serde = { git = "duck://garage-b703fab0/forge/gpui-pre", rev = "c698ed2c7e8eeed46641e5ea9622ee55b84b1486" }

[patch."https://github.com/ducktape-industries/fluent31"]
fluent31 = { git = "duck://garage-b703fab0/forge/fluent31", rev = "76ba1867bc0ba9c09bb8387149c07844f1d2395c" }
