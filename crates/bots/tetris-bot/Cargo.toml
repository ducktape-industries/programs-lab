[package]
name = "tetris-bot"
edition.workspace = true
version.workspace = true
publish = false

# A Tetris versus player with an account of its own: a client of the node's
# live lane, as the app is one, never a view.
[dependencies]
# the rules, the deal, the track names and what a side says, as the view
# has them
arcade-view = { path = "../../app/arcade-view" }
# the program and the room versus is played in
arcade.workspace = true
# the chain's id, as the app names a track's chain
ducklink.workspace = true
borsh.workspace = true
# the live wire of core `dev` 89f3cf555:
# a hello names its key's scheme, and verifying is the node's
live-wire = { git = "https://github.com/ducktape-industries/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
# `/v1/status` decodes into the node's own types (the workspace patches
# core's abi to the programs copy, so it is that one)
core-abi = { package = "abi", git = "https://github.com/ducktape-industries/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
# the device key, signed with as the app signs
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# the node's own `Status`, which the copy in `live.rs` must decode
noded = { git = "https://github.com/ducktape-industries/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb" }
# the node's check of the handshake's proof, which the fake node runs
keyscheme = { git = "https://github.com/ducktape-industries/ducktape", rev = "89f3cf55570df68f7f66f9b31814dcc555673abb", features = ["testkit"] }
tokio = { version = "1", features = ["test-util"] }
